name: Test and deploy game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
      - run: node build.mjs
      - name: Install world snapshot renderer
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Publish editor world with this game deployment
        env:
          OUT: dist/editor-world/${{ github.sha }}
        run: |
          node scripts/world-editor-snapshot.cjs
          node --input-type=module -e "import {writeFile} from 'node:fs/promises'; await writeFile('dist/editor-world/latest.json', JSON.stringify({version:1,commit:process.env.GITHUB_SHA}));"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
